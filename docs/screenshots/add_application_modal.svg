<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <rect width="800" height="550" fill="rgba(15,23,42,0.6)"/>
  
  <!-- Modal Card -->
  <rect x="100" y="40" width="600" height="470" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Header -->
  <rect x="100" y="40" width="600" height="56" rx="16" fill="#f8fafc"/>
  <text x="128" y="75" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Add New Job Application</text>
  <text x="660" y="74" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8">✕</text>
  <line x1="100" y1="96" x2="700" y2="96" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Fields -->
  <!-- Row 1 -->
  <text x="128" y="128" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Company Name *</text>
  <rect x="128" y="136" width="260" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="159" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">Acme Corp</text>

  <text x="412" y="128" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Job Title *</text>
  <rect x="412" y="136" width="260" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="424" y="159" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">Senior Frontend Developer</text>

  <!-- Row 2 -->
  <text x="128" y="198" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Status</text>
  <rect x="128" y="206" width="168" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="229" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">Applied ▼</text>

  <text x="312" y="198" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Work Mode</text>
  <rect x="312" y="206" width="168" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="324" y="229" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">Remote ▼</text>

  <text x="496" y="198" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Employment Type</text>
  <rect x="496" y="206" width="176" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="508" y="229" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">Full-time ▼</text>

  <!-- Row 3 -->
  <text x="128" y="268" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Job Post URL</text>
  <rect x="128" y="276" width="544" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="299" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">https://linkedin.com/jobs/view/123456</text>

  <!-- Row 4 -->
  <text x="128" y="338" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Notes &amp; Context</text>
  <rect x="128" y="346" width="544" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="369" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Referred by Jane from engineering team. System design interview scheduled for next Tuesday.</text>

  <!-- Footer -->
  <line x1="100" y1="446" x2="700" y2="446" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="480" y="460" width="80" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="502" y="483" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#334155">Cancel</text>
  <rect x="572" y="460" width="100" height="36" rx="8" fill="#0284c7"/>
  <text x="588" y="483" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Save Application</text>
</svg>
